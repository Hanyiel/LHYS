spring.application.name=api
server.port=8080

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

lhys.auth.token-secret=${LHYS_AUTH_TOKEN_SECRET:lhys-local-development-token-secret-change-before-production}
lhys.auth.token-expiration-hours=${LHYS_AUTH_TOKEN_EXPIRATION_HOURS:12}

lhys.upload.root-dir=${LHYS_UPLOAD_ROOT_DIR:uploads}
lhys.upload.public-path=${LHYS_UPLOAD_PUBLIC_PATH:/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
